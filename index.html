
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzed × Moffs | QR Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main { max-width: 480px; margin: auto; }

    .brand {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      color: #ccc;
    }

    h1 { text-align: center; font-size: 29px; }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .panel {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px;
    }

    #reader { width: 100%; overflow: hidden; border-radius: 10px; }

    #status {
      margin-top: 16px;
      padding: 14px;
      background: #292929;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #start { background: #fff; color: #111; }
    #open, #reset { background: #333; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .note {
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<main>
  <div class="brand">BUZZED × MOFFS</div>
  <h1>QR CHECK-IN</h1>
  <div class="subtitle">Event staff registration scanner</div>

  <section class="panel">
    <div id="reader"></div>
    <div id="status">Tap Start Scanner and allow camera access.</div>
    <button id="start">Start Scanner</button>
    <button id="open" disabled>Open Check-in Link</button>
    <button id="reset" disabled>Scan Next Attendee</button>
  </section>

  <p class="note">
    Scan official registration QR codes only.
    Verify the check-in result before admitting an attendee.
  </p>
</main>

<script>
  const statusBox = document.getElementById("status");
  const startBtn = document.getElementById("start");
  const openBtn = document.getElementById("open");
  const resetBtn = document.getElementById("reset");

  let scanner = null;
  let scannedUrl = "";
  let locked = false;

  function showStatus(message) {
    statusBox.textContent = message;
  }

  function extractRegistrationUrl(text) {
    let url = new URL(text);

    // If a QR contains a QuickChart URL, unwrap its embedded link.
    if (url.hostname === "quickchart.io" && url.pathname === "/qr") {
      const embedded = url.searchParams.get("text");
      if (!embedded) throw new Error("Missing embedded link");
      url = new URL(embedded);
    }

    if (
      url.protocol !== "https:" ||
      url.hostname !== "script.google.com" ||
      !url.pathname.endsWith("/exec") ||
      !url.searchParams.has("id")
    ) {
      throw new Error("Unrecognized registration link");
    }

    return url.href;
  }

  async function startScanner() {
    startBtn.disabled = true;

    try {
      if (!scanner) scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        async (decodedText) => {
          if (locked) return;

          try {
            scannedUrl = extractRegistrationUrl(decodedText);
          } catch (error) {
            showStatus(
              "QR detected, but link not recognized.\n\nScanned text:\n" +
              decodedText
            );
            return;
          }

          locked = true;

          try { await scanner.stop(); } catch (error) {}

          showStatus(
            "QR recognized!\n\nTap Open Check-in Link to verify registration."
          );

          openBtn.disabled = false;
          resetBtn.disabled = false;
        },
        () => {}
      );

      showStatus("Scanner active. Point the camera at a registration QR code.");

    } catch (error) {
      showStatus(
        "Camera could not start. Allow camera access and use the HTTPS website."
      );
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener("click", startScanner);

  openBtn.addEventListener("click", () => {
    if (!scannedUrl) return;
    window.open(scannedUrl, "_blank");
    showStatus("Check-in link opened. Read its result before admitting the attendee.");
  });

  resetBtn.addEventListener("click", () => {
    scannedUrl = "";
    locked = false;
    openBtn.disabled = true;
    resetBtn.disabled = true;
    startBtn.disabled = false;
    showStatus("Ready to scan the next attendee.");
  });
</script>
</body>
</html>
