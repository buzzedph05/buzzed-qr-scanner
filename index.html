
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Buzzed × Moffs | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: auto;
    }

    .brand {
      text-align: center;
      letter-spacing: 3px;
      font-size: 13px;
      color: #d6d6d6;
    }

    h1 {
      text-align: center;
      font-size: 29px;
      margin: 12px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .panel {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      background: #292929;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }

    .primary {
      background: #fff;
      color: #111;
    }

    .secondary {
      background: #333;
      color: #fff;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .note {
      color: #999;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">BUZZED × MOFFS</div>
    <h1>QR CHECK-IN</h1>
    <div class="subtitle">Event staff registration scanner</div>

    <section class="panel">
      <div id="reader"></div>

      <div id="status" role="status" aria-live="polite">
        Tap Start Scanner and allow camera access.
      </div>

      <button class="primary" id="start">
        Start Scanner
      </button>

      <button class="secondary" id="open" disabled>
        Open Check-in Link
      </button>

      <button class="secondary" id="reset" disabled>
        Scan Next Attendee
      </button>
    </section>

    <p class="note">
      Scan official Buzzed × Moffs registration QR codes only.
      Verify the attendee's result before allowing entry.
    </p>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const openBtn = document.getElementById("open");
    const resetBtn = document.getElementById("reset");

    let scanner = null;
    let scannedUrl = "";
    let locked = false;

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function getRegistrationUrl(decodedText) {
      let url = new URL(decodedText);

      // Handle a QuickChart QR URL containing the real link.
      if (
        url.hostname === "quickchart.io" &&
        url.pathname === "/qr"
      ) {
        const embeddedLink = url.searchParams.get("text");

        if (!embeddedLink) {
          throw new Error("Missing registration link");
        }

        url = new URL(embeddedLink);
      }

      // Accept only our Google Apps Script web-app links.
      if (
        url.protocol !== "https:" ||
        url.hostname !== "script.google.com" ||
        !url.pathname.endsWith("/exec") ||
        !url.searchParams.get("id")
      ) {
        throw new Error("Unrecognized registration QR");
      }

      return url.href;
    }

    async function startScanner() {
      startBtn.disabled = true;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 }
          },
          async (decodedText) => {
            if (locked) return;

            let registrationUrl;

            try {
              registrationUrl = getRegistrationUrl(decodedText);
            } catch (error) {
              showStatus(
                "Unrecognized QR code. Please scan an official registration QR."
              );
              return;
            }

            locked = true;
            scannedUrl = registrationUrl;

            try {
              await scanner.stop();
            } catch (error) {
              // Continue if the camera has already stopped.
            }

            showStatus(
              "QR code detected. Tap Open Check-in Link to verify this registration."
            );

            openBtn.disabled = false;
            resetBtn.disabled = false;
            startBtn.disabled = true;
          },
          () => {
            // Ignore ordinary camera frames without a QR match.
          }
        );

        showStatus(
          "Scanner active. Point the camera at an attendee QR code."
        );

      } catch (error) {
        showStatus(
          "Camera could not start. Allow camera access and open this page over HTTPS."
        );

        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", startScanner);

    openBtn.addEventListener("click", () => {
      if (!scannedUrl) return;

      window.open(scannedUrl, "_blank");

      showStatus(
        "Check-in link opened in a new tab. Read the result before admitting the attendee."
      );
    });

    resetBtn.addEventListener("click", () => {
      scannedUrl = "";
      locked = false;

      openBtn.disabled = true;
      resetBtn.disabled = true;
      startBtn.disabled = false;

      showStatus("Ready to scan the next attendee.");
    });
  </script>
</body>
</html>
